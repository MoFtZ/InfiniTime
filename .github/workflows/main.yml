name: CI

# Run this workflow whenever the build may be affected
on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'doc/**'
      - '**.md'
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - 'doc/**'
      - '**.md'

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    container:
      image: infinitime/infinitime-build
    outputs:
      text_size: ${{ steps.output-sizes.outputs.text_size }}
      data_size: ${{ steps.output-sizes.outputs.data_size }}
      bss_size: ${{ steps.output-sizes.outputs.bss_size }}
      firmware_artifact: ${{ steps.upload-firmware.outputs.artifact-id }}
      resources_artifact: ${{ steps.upload-resources.outputs.artifact-id }}
    env:
      # InfiniTime sources are downloaded to the current directory.
      # Override SOURCES_DIR in build.sh
      SOURCES_DIR: .
    steps:
      - name: Checkout source files
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install resource build dependencies
        run:  |
          apt-get update
          apt-get -y install --no-install-recommends python3-pil
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory /__w/InfiniTime/InfiniTime
          /opt/build.sh all
      - name: Output build size
        id: output-sizes
        shell: bash
        run: |
          . /opt/build.sh
          .github/workflows/getSize.sh "$BUILD_DIR"/src/pinetime-app-*.out >> $GITHUB_OUTPUT
      # Unzip the package because Upload Artifact will zip up the files
      - name: Unzip DFU package
        run: unzip ./build/output/pinetime-mcuboot-app-dfu-*.zip -d ./build/output/pinetime-mcuboot-app-dfu
      - name: Set ref_name, but replace slashes with dashes.
        shell: bash
        env:
          ref_name: ${{ github.head_ref || github.ref_name }}
        run: echo "REF_NAME=${ref_name//\//-}" >> $GITHUB_ENV
      - name: Upload DFU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfiniTime DFU ${{ env.REF_NAME }}
          path: ./build/output/pinetime-mcuboot-app-dfu/*
      - name: Upload MCUBoot image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfiniTime MCUBoot image ${{ env.REF_NAME }}
          path: ./build/output/pinetime-mcuboot-app-image-*.bin
      - name: Upload standalone ELF artifacts
        uses: actions/upload-artifact@v4
        id: upload-firmware
        with:
          name: InfiniTime image ${{ env.REF_NAME }}
          path: ./build/output/src/pinetime-app-*.out
      - name: Upload resources artifacts
        uses: actions/upload-artifact@v4
        id: upload-resources
        with:
          name: InfiniTime resources ${{ env.REF_NAME }}
          path: ./build/output/infinitime-resources-*.zip
      - name: Stage release assets
        if: github.event_name == 'push'
        run: |
          mkdir -p release-assets
          cp ./build/output/pinetime-mcuboot-app-dfu-*.zip   release-assets/
          cp ./build/output/pinetime-mcuboot-app-image-*.bin release-assets/
          cp ./build/output/infinitime-resources-*.zip       release-assets/
      - name: Upload release assets bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*

  build-simulator:
    runs-on: ubuntu-22.04
    steps:
    - name: Install SDL2 and libpng development package
      run:  |
        sudo apt-get update
        sudo apt-get -y install libsdl2-dev libpng-dev

    - name: Install Ninja
      run:  |
        sudo apt-get -y install ninja-build

    - name: Install lv_font_conv
      run:
        npm i -g lv_font_conv@1.5.2

    - name: Checkout source files
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Get InfiniSim repo
      run:  |
        git clone https://github.com/InfiniTimeOrg/InfiniSim.git --depth 1 --branch main
        git -C InfiniSim submodule update --init lv_drivers

    - name: CMake
      # disable BUILD_RESOURCES as this is already done when building the firmware
      run:  |
        cmake -G Ninja -S InfiniSim -B build_lv_sim -DInfiniTime_DIR="${PWD}" -DBUILD_RESOURCES=OFF

    - name: Build simulator executable
      run:  |
        cmake --build build_lv_sim

    - name: Upload simulator executable
      uses: actions/upload-artifact@v4
      with:
        name: infinisim-${{ env.REF_NAME }}
        path: build_lv_sim/infinisim

  release-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write              # scoped to this job only
    concurrency:                   # serialize only the release publish; builds still run in parallel
      group: develop-release
      cancel-in-progress: false    # never cancel a half-published release
    steps:
      - uses: actions/checkout@v3        # needed to force-move the rolling tag
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish / refresh develop-latest rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1. Move the rolling tag to this commit (creates it on first run).
          git tag -f develop-latest
          git push -f origin develop-latest
          NOTES="Automated rolling build from the latest commit on \`develop\`.
          Commit: ${GITHUB_SHA}
          Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 2. Create the release if missing, else update its metadata.
          if gh release view develop-latest >/dev/null 2>&1; then
            gh release edit develop-latest --prerelease \
              --title "InfiniTime develop (latest build)" --notes "$NOTES"
          else
            gh release create develop-latest --prerelease --target "$GITHUB_SHA" \
              --title "InfiniTime develop (latest build)" --notes "$NOTES"
          fi
          # 3. Upload/replace the flashable assets (stable filenames -> --clobber).
          gh release upload develop-latest release-assets/* --clobber
